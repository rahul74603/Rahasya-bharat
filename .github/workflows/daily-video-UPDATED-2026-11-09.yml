name: Rahasya Bharat — Daily Video

# Slot targets: Subah 08:00 IST | Shaam 19:00 IST
# 2026-11-07 timing fix: GitHub ke schedule asal me ~3.5-8 ghante late fire
# hote hain (hafton ke run-saboot ka hisaab). Isliye har slot ke do cron hain:
# ek ~7 ghante pehle (taaki late fire hokar bhi post asal samay ke aas-paas
# pahunche) aur ek 1 ghanta pehle ka backup (pehla fire hi na ho to dusra
# sambhale). Neeche wala same-day guard dohra post rokta hai.
on:
  schedule:
    - cron: "30 19 * * *"   # subah MAIN   = 01:00 IST (target 08:00)
    - cron: "30 1 * * *"    # subah BACKUP = 07:00 IST
    - cron: "30 6 * * *"    # shaam MAIN   = 12:00 IST (target 19:00)
    - cron: "30 12 * * *"   # shaam BACKUP = 18:00 IST
  workflow_dispatch:
    inputs:
      slot:
        description: "Kaunsi video banani hai"
        type: choice
        options: [morning, evening]
        default: morning
      dry_run:
        description: "Sirf video banao, publish mat karo"
        type: boolean
        default: false

permissions:
  contents: write

# Ek samay me ek hi run: do cron takkarayein to state.json ki push aur
# dohra post dono ka khatra hota hai. Dusra run pehle ke khatam hone ka
# intezaar karega (cancel nahi hoga).
concurrency:
  group: daily-video
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system deps (ffmpeg + Devanagari fonts)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-core > /dev/null
          fc-list | grep -i devanagari | head -2 || true

      - name: Install Python deps
        run: pip install -q -r requirements.txt

      - name: Test gate (offline unit tests — fail here, nothing is built)
        run: python -m unittest discover -s tests -v

      - name: Decide slot
        id: slot
        # Slot ghadi se NAHI, is run ko bulane wale cron se tay hota hai.
        # Purana ghadi-wala niyam (UTC hour = 02 tabhi morning) 2026-11-04
        # ko fail hua: GitHub ne subah wala run 7 ghante late chalaya,
        # ghadi shaam dikha rahi thi, to subah ki video ki jagah shaam ki
        # video ban gayi. github.event.schedule me woh cron string hoti
        # hai jisne run bulaya — run kitna bhi late ho, woh nahi badalti.
        # 2026-11-07: cron badal gaye (har slot ke do) — subah ke dono cron
        # (30 19 aur 30 1 UTC) morning dete hain, baaki sab evening.
        run: |
          if [ -n "${{ inputs.slot }}" ] && [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "slot=${{ inputs.slot }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "30 19 * * *" ] || [ "${{ github.event.schedule }}" = "30 1 * * *" ]; then
            echo "slot=morning" >> "$GITHUB_OUTPUT"
          else
            echo "slot=evening" >> "$GITHUB_OUTPUT"
          fi

      - name: Same-day slot guard (backup cron se dohra post roko)
        id: guard
        if: ${{ github.event_name == 'schedule' }}
        run: |
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone, timedelta
          ist = timezone(timedelta(hours=5, minutes=30))
          slot = "${{ steps.slot.outputs.slot }}"
          # Pipeline-day: raat 04:00 IST se agle din 04:00 tak ek din. Shaam ki
          # video late fire hokar raat 02:xx par post ho to woh PICHHLE din ke
          # slot ki hai — seedha calendar-date milaya to woh entry agle din ke
          # shaam wale guard ko galat rok degi. Isliye dono taraf 4 ghante
          # peeche sarka kar din nikala jata hai.
          def pipe_day(iso_ts):
              return (datetime.fromisoformat(iso_ts) - timedelta(hours=4)).date().isoformat()
          today = pipe_day(datetime.now(ist).isoformat())
          posted = False
          try:
              state = json.load(open("state.json"))
              for info in (state.get("posted") or {}).values():
                  if not isinstance(info, dict) or info.get("slot") != slot:
                      continue
                  if pipe_day(str(info.get("at", ""))) != today:
                      continue
                  res = info.get("results") or {}
                  if isinstance(res, dict) and any(res.values()):
                      posted = True
          except Exception as e:
              print("guard check fail, run jaari rahega:", e)
          print("slot =", slot, "| aaj (IST) =", today, "| pehle post hua =", posted)
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("skip=" + ("true" if posted else "false") + "\n")
          PY

      - name: Build + publish
        if: ${{ steps.guard.outputs.skip != 'true' }}
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DRY=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then DRY="--dry-run"; fi
          python scripts/run.py --slot "${{ steps.slot.outputs.slot }}" $DRY

      - name: Save rotation state (kaunsa topic post ho gaya)
        if: ${{ inputs.dry_run != true && steps.guard.outputs.skip != 'true' }}
        run: |
          git config user.name "rahasya-bot"
          git config user.email "actions@github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "chore: rotation state update [skip ci]"
          git push

      - name: Run summary (posted / pending / quarantined / topic bank)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/summary.py
